plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The server is NOT vendored here: it is staged at build time from ../server so there is
// one copy of the truth. `stageServer` copies the runtime modules into Chaquopy's python
// source dir (gitignored) as a package, along with the pre-built design cache and the
// design pack.
//
// WHY A PACKAGE, when the modules import each other as top level (`import player_state`)?
// Because `extractPackages` works per package, and we NEED extraction: design_data and
// player_state open real files next to themselves, which fails while they live inside
// Chaquopy's asset bundle. main.py puts the extracted dir on sys.path, so the flat
// imports keep working untouched.
def serverDir = file("${rootDir}/../server")
def stage = file("${projectDir}/src/main/python/sevensins")

// ---- Hot-update channel -------------------------------------------------------------
// The release repo serving update.json + server_update.zip is configured per-machine
// rather than committed, so a clone can be built and pointed at its own channel:
//
//     hostapp/local.properties   (gitignored)
//     sevensins.updateRepo=owner/name
//
// BUILD-time, not runtime, and it must stay that way: the value is baked into the APK
// exactly as a literal constant would be, so pointing an installed device at a different
// update host takes a rebuild and reinstall rather than a setting.
//
// Left unset the app builds and runs fine; "Check for updates" reports that no channel is
// configured rather than reaching somewhere wrong.
def updateRepo = ''
def localProps = file("${rootDir}/local.properties")
if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    updateRepo = props.getProperty('sevensins.updateRepo', '')
}
if (!updateRepo) {
    logger.lifecycle('hostapp: no sevensins.updateRepo in local.properties -- ' +
                     'building without a hot-update channel')
}

// The file LIST lives in ../server_files.json, shared with tools/build_hostapp_update.py
// (the hot-updater's build tool) so there is exactly one place that says what "the
// server code" means. Before this split, `battle_effects` (added when the engine became
// a package) went unlisted here for several commits and every hostapp build silently
// shipped a copy that could not `import battle_effects` -- see memory
// sevensins-hostapp-updater. Two consumers, one list, never drift again.
def fileList = new groovy.json.JsonSlurper().parse(file("${rootDir}/server_files.json"))
def runtimeModules = fileList.modules
def runtimePackages = fileList.packages
def runtimeDataDirs = fileList.data_dirs
// Single data FILES (save_editor_ui.html), as opposed to whole data dirs. `?: []` so an
// older server_files.json without the key still builds.
def runtimeDataFiles = fileList.data_files ?: []

tasks.register('stageServer', Copy) {
    description = 'Stage the Seven Sins server package into the Chaquopy python source dir.'
    // **server_files.json is read at CONFIGURATION time**, above, into the include
    // patterns below -- so Gradle cannot infer it as an input, and editing the list
    // leaves this task UP-TO-DATE while the newly-listed package is silently never
    // staged. Declaring it explicitly is what forces a re-stage when the list changes.
    //
    // Not hypothetical: `engine` was added to `packages` and stageServer went on
    // reporting UP-TO-DATE, so an APK was built, installed and verified with no
    // engine/ in it at all. Every module imported fine except battle.py, which would
    // have died on `from engine import core` the moment the server started.
    inputs.file(file("${rootDir}/server_files.json"))
    doFirst {
        runtimeModules.each { m ->
            if (!file("${serverDir}/${m}").exists()) {
                throw new GradleException("missing ${serverDir}/${m}")
            }
        }
        runtimePackages.each { p ->
            if (!file("${serverDir}/${p}/__init__.py").exists()) {
                throw new GradleException("missing package ${serverDir}/${p}/__init__.py")
            }
        }
        runtimeDataDirs.each { d ->
            if (!file("${serverDir}/${d}").directory) {
                throw new GradleException("missing data dir ${serverDir}/${d}")
            }
        }
        runtimeDataFiles.each { f ->
            if (!file("${serverDir}/${f}").exists()) {
                throw new GradleException("missing data file ${serverDir}/${f}")
            }
        }
        // Drop any stale copy so a removed/renamed module does not linger on device.
        delete stage
    }
    into stage
    // ONE from-spec covering both the flat modules and the package(s). Two separate
    // from(serverDir) blocks each matched player_state/core.py and Gradle flagged it as a
    // duplicate destination entry; a single spec matches each file at most once.
    from(serverDir) {
        include runtimeModules
        include runtimeDataFiles
        runtimePackages.each { include "${it}/**" }
        runtimeDataDirs.each { include "${it}/**" }
        // A runtime package is code only. Desktop runs leave __pycache__ next to it, and
        // player_state's STATE_DIR default would drop an accounts/ dir inside the package
        // if its anchor were ever wrong again -- neither belongs in the shipped app.
        //
        // `*.bak*` covers editing backups kept beside the module they shadow --
        // player_state/core.py.bak-refactor alone is 225 KB of dead weight in every APK.
        // The hot-update path already skipped these (build_hostapp_update._is_stray drops
        // any multi-dot name that is not .py/.json/.html); this is the same rule for the
        // APK path, which was the only consumer still shipping them. The two builds share
        // server_files.json but NOT their exclusions, so a filter added to one has to be
        // added to the other by hand -- which is exactly how this drifted.
        exclude '**/__pycache__/**', '**/*.pyc', '**/accounts/**', '**/*.bak*'
    }
    // Pre-built design tables: shipping these is what keeps the app free of UnityPy and
    // TypeTreeGenerator, which design_data imports ONLY when it has to reparse the pack.
    // Includes the `.source` stamp dotfile, which is load-bearing: without it
    // design_data._ensure_stamp decides the cache came from a different pack, PURGES
    // every form and tries to reparse -- which on device means importing UnityPy, which
    // is not installed. Verify it survives into the APK after changing this block.
    // The `include '**'` is REQUIRED, not decorative. Once the from(serverDir) block
    // above declares include patterns (runtimeModules + player_state/**), Gradle applies
    // them as the task's effective filter to sibling from-blocks that declare none -- so
    // without an explicit include here, design_cache matched nothing and staged EMPTY,
    // failing the cache-stamp guard. Every from-block must carry its own include.
    from("${serverDir}/design_cache") { include '**'; into 'design_cache' }
    // A minimal patch_root, copied into app storage on first run. Two things are
    // non-negotiable for the client to boot:
    //   * the AssetBundleManifest -- the FIRST thing it fetches; without it the title
    //     screen sits on "Retrieving patch manifest ... Retry n/10" and never proceeds;
    //   * the design pack, which is both what the client downloads AND what the server
    //     parses, so design_data's stamp matches and no reparse is attempted.
    // Everything else is the user-imported bundle set.
    from("${serverDir}/patch_root/bundles") {
        include 'design_pack_*.ab'
        into 'pack/bundles'
    }
    from("${serverDir}/patch_root/Android_AssetBundles") {
        include '231101en/Android'
        into 'pack/Android_AssetBundles'
    }
    // A starting account, so a fresh install can log straight in.
    from("${serverDir}/accounts") { include '1000001.json'; into 'seed_accounts' }
    // Without __init__.py this is a NAMESPACE package: its __file__ is None, and
    // Chaquopy's extractPackages does not apply to one. Both matter -- main.py locates
    // the extracted directory through this package.
    doLast {
        new File(stage, '__init__.py').text =
            '# Staged Seven Sins server package (generated by the stageServer task).\n'

        // GUARD: the shipped design cache must have been built from the shipped pack.
        // design_data's stamp is "<pack name>:<sha1 of pack>:DummyDll"; if it does not
        // match, the device decides the cache is stale. It can no longer delete it (see
        // _ensure_stamp), but it would serve tables that do not match the pack the
        // client is running. Re-patching the pack after warming the cache is an easy
        // mistake to make -- it cost a debugging round already -- so fail the BUILD
        // rather than ship the mismatch. Fix by re-warming: see hostapp/README.md.
        def packFile = new File(stage, 'pack/bundles').listFiles()
                ?.find { it.name.startsWith('design_pack_') }
        def stampFile = new File(stage, 'design_cache/.source')
        if (packFile == null) throw new GradleException("no design pack staged")
        if (!stampFile.exists()) throw new GradleException("no design_cache/.source staged")
        def digest = java.security.MessageDigest.getInstance('SHA-1')
        packFile.eachByte(1 << 20) { buf, n -> digest.update(buf, 0, n) }
        def sha1 = digest.digest().encodeHex().toString()
        def expected = "${packFile.name}:${sha1}:DummyDll"
        def actual = stampFile.text.trim()
        if (actual != expected) {
            throw new GradleException(
                "design cache was NOT built from the staged pack.\n" +
                "  staged pack : ${expected}\n" +
                "  cache stamp : ${actual}\n" +
                "Re-warm the cache against the current pack, then rebuild.")
        }
        logger.lifecycle("stageServer: cache matches pack (${packFile.name})")
    }
}

tasks.matching { it.name ==~ /merge.*PythonSources/ }.configureEach {
    dependsOn 'stageServer'
}

android {
    namespace 'com.sevensins.host'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sevensins.host'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        // Empty when unconfigured -- UpdateManager treats that as "no channel".
        buildConfigField 'String', 'UPDATE_REPO', "\"${updateRepo}\""
        // arm64 for real devices, x86_64 so it also runs on the development AVD.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        python {
            version '3.12'
            // Materialize the package on the filesystem: design_data reads its cache and
            // the pack through real paths, and player_state writes account JSON.
            extractPackages 'sevensins'
            // NO pip block, deliberately. The whole server is stdlib-only -- design_data
            // imports UnityPy lazily and never reaches that path with a warm cache.
        }
    }
    buildFeatures { buildConfig true }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = 'SevenSinsHost.apk'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
